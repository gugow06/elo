name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: API e pacotes Node (lint, typecheck, testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elo
          POSTGRES_PASSWORD: elo_ci
          POSTGRES_DB: elo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elo -d elo"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://elo:elo_ci@localhost:5432/elo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Avaliação da triagem (evidência da área 1)
        run: |
          pnpm --filter @elo/triagem avaliar
          pnpm --filter @elo/triagem avaliar validacao

  pipeline-dados:
    name: Pipeline de dados (pytest)
    runs-on: ubuntu-latest
    needs: node
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elo
          POSTGRES_PASSWORD: elo_ci
          POSTGRES_DB: elo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elo -d elo"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://elo:elo_ci@localhost:5432/elo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: area2-dados/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Migra e popula o banco
        run: pnpm --filter @elo/api db:migrate && pnpm --filter @elo/api db:seed
      - run: pip install -r area2-dados/requirements.txt
      - name: Testes do pipeline
        working-directory: area2-dados
        run: python -m pytest -v

  docker:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: [node, pipeline-dados]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - name: Sobe a stack e verifica a saúde da API
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:3333/saude
      - if: always()
        run: docker compose logs --tail 100
